<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root {
  --md-primary: #00696C;
  --md-on-primary: #FFFFFF;
  --md-primary-container: #6FF6FB;
  --md-on-primary-container: #002021;
  --md-secondary: #4A6363;
  --md-secondary-container: #CCE8E7;
  --md-on-secondary-container: #051F1F;
  --md-tertiary: #4C5F7C;
  --md-tertiary-container: #D4E3FF;
  --md-on-tertiary-container: #041C35;
  --md-surface: #F4FBFA;
  --md-on-surface: #161D1D;
  --md-surface-variant: #DAE5E3;
  --md-on-surface-variant: #3F4948;
  --md-surface-container-lowest: #FFFFFF;
  --md-surface-container-low: #EFF5F4;
  --md-surface-container: #E9EFEE;
  --md-surface-container-high: #E3E9E8;
  --md-surface-container-highest: #DDE4E2;
  --md-outline: #6F7979;
  --md-outline-variant: #BEC9C7;
  --md-background: #F4FBFA;
  --md-on-background: #161D1D;
  color-scheme: light;
}
.dark {
  --md-primary: #4CDADF;
  --md-on-primary: #003739;
  --md-primary-container: #004F52;
  --md-on-primary-container: #6FF6FB;
  --md-secondary: #B1CCCB;
  --md-secondary-container: #324B4B;
  --md-on-secondary-container: #CCE8E7;
  --md-tertiary: #B3C8E8;
  --md-tertiary-container: #334863;
  --md-on-tertiary-container: #D4E3FF;
  --md-surface: #0E1514;
  --md-on-surface: #DDE4E3;
  --md-surface-variant: #3F4948;
  --md-on-surface-variant: #BEC9C7;
  --md-surface-container-lowest: #090F0F;
  --md-surface-container-low: #161E1D;
  --md-surface-container: #1B2322;
  --md-surface-container-high: #252D2C;
  --md-surface-container-highest: #303837;
  --md-outline: #899392;
  --md-outline-variant: #3F4948;
  --md-background: #0E1514;
  --md-on-background: #DDE4E3;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--md-background);
  color: var(--md-on-background);
  font-family: "Instrument Sans", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  font-kerning: normal;
  line-height: 1.5;
  transition: background 400ms cubic-bezier(0.2,0,0,1), color 400ms cubic-bezier(0.2,0,0,1);
  background-image:
    radial-gradient(ellipse 80% 60% at 10% 0%, color-mix(in srgb, var(--md-primary) 12%, transparent) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 30%, color-mix(in srgb, var(--md-tertiary) 10%, transparent) 0%, transparent 55%),
    linear-gradient(180deg, var(--md-background) 0%, var(--md-surface-container-low) 40%, var(--md-background) 100%);
  background-attachment: fixed;
}
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }

/* ---------- Layout ---------- */
.container { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
.container-narrow { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }
section { padding: 5rem 0; scroll-margin-top: 4rem; }
@media (min-width: 640px) { section { padding: 7rem 0; } .container, .container-narrow { padding: 0 2rem; } }

/* ---------- Navbar ---------- */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: all 300ms cubic-bezier(0.2,0,0,1); }
.navbar.scrolled { background: var(--md-surface-container-low); box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15); }
.dark .navbar.scrolled { box-shadow: none; border-bottom: 1px solid var(--md-outline-variant); }
.navbar-inner { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; height: 4rem; display: flex; align-items: center; justify-content: space-between; }
@media (min-width: 640px) { .navbar-inner { padding: 0 2rem; } }
.navbar-logo { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.125rem; letter-spacing: -0.025em; color: var(--md-on-surface); }
.navbar-logo .accent { color: var(--md-primary); }
.navbar-links { display: none; align-items: center; gap: 0.25rem; }
@media (min-width: 768px) { .navbar-links { display: flex; } }
.navbar-links a { padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500; color: var(--md-on-surface-variant); transition: color 150ms; }
.navbar-links a:hover { color: var(--md-on-surface); background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
.navbar-actions { display: flex; align-items: center; gap: 0.5rem; }
.btn-icon { width: 2.5rem; height: 2.5rem; border: none; border-radius: 9999px; background: transparent; color: var(--md-on-surface-variant); display: grid; place-items: center; cursor: pointer; transition: color 150ms, background 150ms; }
.btn-icon:hover { color: var(--md-on-surface); background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }
.btn-lang { height: 2.5rem; padding: 0 1rem; border: none; border-radius: 9999px; background: var(--md-secondary-container); color: var(--md-on-secondary-container); font-size: 0.875rem; font-weight: 600; display: flex; align-items: center; gap: 0.375rem; cursor: pointer; transition: filter 150ms; }
.btn-lang:hover { filter: brightness(0.96); }
.btn-github { width: 2.5rem; height: 2.5rem; border: none; border-radius: 9999px; background: var(--md-primary); color: var(--md-on-primary); display: grid; place-items: center; cursor: pointer; transition: filter 150ms; }
.btn-github:hover { filter: brightness(1.1); }

/* ---------- Hero ---------- */
.hero { position: relative; padding-top: 8rem; padding-bottom: 5rem; overflow: hidden; }
@media (min-width: 640px) { .hero { padding-top: 10rem; padding-bottom: 7rem; } }
.hero-glow { position: absolute; top: -6rem; right: -6rem; width: 28rem; height: 28rem; border-radius: 9999px; opacity: 0.12; filter: blur(64px); background: var(--md-primary); pointer-events: none; }
.hero-content { max-width: 56rem; position: relative; }
.hero-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); border-radius: 9999px; padding: 0.375rem 0.875rem; font-size: 0.75rem; font-weight: 600; font-family: "JetBrains Mono", monospace; margin-bottom: 1.5rem; }
.hero-badge .dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: var(--md-tertiary); }
.hero h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 3rem; letter-spacing: -0.025em; line-height: 1.02; color: var(--md-on-surface); margin-bottom: 1.75rem; }
@media (min-width: 640px) { .hero h1 { font-size: 4.5rem; } }
.hero h1 .accent { color: var(--md-primary); }
.hero-tagline { max-width: 42rem; font-size: 1.125rem; line-height: 1.625; color: var(--md-on-surface-variant); margin-bottom: 2.5rem; }
@media (min-width: 640px) { .hero-tagline { font-size: 1.25rem; } }
.hero-cta { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 4rem; }
.btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--md-primary); color: var(--md-on-primary); border-radius: 9999px; padding: 0.875rem 1.5rem; font-size: 0.875rem; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15); transition: box-shadow 200ms; }
.btn-primary:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15); }
.btn-secondary { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--md-surface-container-high); color: var(--md-on-surface); border: 1px solid var(--md-outline-variant); border-radius: 9999px; padding: 0.875rem 1.5rem; font-size: 0.875rem; font-weight: 600; transition: box-shadow 200ms; }
.btn-secondary:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15); }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; max-width: 32rem; }
@media (min-width: 640px) { .hero-stats { gap: 2rem; } }
.hero-stat-num { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.875rem; color: var(--md-primary); font-variant-numeric: tabular-nums; }
@media (min-width: 640px) { .hero-stat-num { font-size: 2.25rem; } }
.hero-stat-label { font-size: 0.75rem; color: var(--md-on-surface-variant); margin-top: 0.25rem; }
@media (min-width: 640px) { .hero-stat-label { font-size: 0.875rem; } }

/* ---------- Section Header ---------- */
.section-header { margin-bottom: 3rem; }
@media (min-width: 640px) { .section-header { margin-bottom: 4rem; } }
.section-header .index { font-family: "JetBrains Mono", monospace; font-size: 0.875rem; color: var(--md-primary); font-weight: 500; font-variant-numeric: tabular-nums; }
.section-header .line { display: inline-block; height: 1px; width: 3rem; background: var(--md-outline-variant); vertical-align: middle; margin-left: 1rem; }
.section-header h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.875rem; letter-spacing: -0.025em; color: var(--md-on-surface); margin: 1rem 0; }
@media (min-width: 640px) { .section-header h2 { font-size: 3rem; } }
.section-header p { max-width: 42rem; font-size: 1rem; line-height: 1.625; color: var(--md-on-surface-variant); }
@media (min-width: 640px) { .section-header p { font-size: 1.125rem; } }

/* ---------- Project Cards ---------- */
.project-grid { display: grid; gap: 1.5rem; }
@media (min-width: 640px) { .project-grid { grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start; } .project-card.offset { margin-top: 4rem; } }
.project-card { background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 28px; padding: 1.75rem; transition: box-shadow 300ms, transform 300ms; }
@media (min-width: 640px) { .project-card { padding: 2.25rem; } }
.project-card:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15); transform: translateY(-4px); }
.project-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
.project-card-title { display: flex; align-items: center; gap: 0.75rem; }
.project-card-dot { width: 0.75rem; height: 0.75rem; border-radius: 9999px; flex-shrink: 0; }
.project-card h3 { font-family: "JetBrains Mono", monospace; font-size: 1.25rem; font-weight: 600; color: var(--md-on-surface); }
@media (min-width: 640px) { .project-card h3 { font-size: 1.5rem; } }
.project-card-stats { display: flex; align-items: center; gap: 0.75rem; font-size: 0.75rem; font-family: "JetBrains Mono", monospace; color: var(--md-on-surface-variant); flex-shrink: 0; }
.project-card-stats span { display: flex; align-items: center; gap: 0.25rem; }
.project-card-desc { font-size: 0.9375rem; line-height: 1.625; color: var(--md-on-surface-variant); margin-bottom: 1.5rem; }
@media (min-width: 640px) { .project-card-desc { font-size: 1rem; } }
.project-card-highlights { margin-bottom: 1.75rem; }
.project-card-highlights li { display: flex; align-items: flex-start; gap: 0.625rem; font-size: 0.875rem; color: var(--md-on-surface-variant); margin-bottom: 0.625rem; }
.project-card-highlights svg { margin-top: 0.125rem; flex-shrink: 0; color: var(--md-primary); }
.project-card-footer { display: flex; flex-wrap: wrap; align-items: center; gap: 0.625rem; }
.project-card-lang { font-family: "JetBrains Mono", monospace; font-size: 0.75rem; font-weight: 500; background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); border-radius: 9999px; padding: 0.375rem 0.75rem; }
.project-card-spacer { flex: 1; }
.btn-sm { display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 9999px; padding: 0.5rem 1rem; font-size: 0.875rem; font-weight: 600; transition: box-shadow 200ms; cursor: pointer; text-decoration: none; }
.btn-sm-repo { background: var(--md-surface-container-high); color: var(--md-on-surface); border: 1px solid var(--md-outline-variant); }
.btn-sm-repo:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15); }
.btn-sm-demo { background: var(--md-primary); color: var(--md-on-primary); }
.btn-sm-demo:hover { filter: brightness(1.1); }

/* ---------- Blog Cards ---------- */
.blog-grid { display: grid; gap: 1.5rem; }
@media (min-width: 640px) { .blog-grid { grid-template-columns: repeat(3, 1fr); gap: 1.75rem; align-items: start; } .blog-card.offset { transform: translateY(2.5rem); } }
.blog-card { display: block; background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 24px; padding: 1.5rem; transition: box-shadow 300ms, transform 300ms; }
@media (min-width: 640px) { .blog-card { padding: 1.75rem; } }
.blog-card:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15); transform: translateY(-4px); }
.blog-card-meta { display: flex; align-items: center; gap: 0.75rem; font-size: 0.75rem; font-family: "JetBrains Mono", monospace; color: var(--md-on-surface-variant); margin-bottom: 1rem; }
.blog-card-meta .sep { width: 0.25rem; height: 0.25rem; border-radius: 9999px; background: var(--md-outline); }
.blog-card h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.25rem; line-height: 1.375; color: var(--md-on-surface); margin-bottom: 0.75rem; transition: color 200ms; }
@media (min-width: 640px) { .blog-card h3 { font-size: 1.5rem; } }
.blog-card:hover h3 { color: var(--md-primary); }
.blog-card-excerpt { font-size: 0.875rem; line-height: 1.625; color: var(--md-on-surface-variant); margin-bottom: 1.25rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.blog-card-footer { display: flex; align-items: center; justify-content: space-between; }
.blog-card-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.blog-card-tag { background: var(--md-secondary-container); color: var(--md-on-secondary-container); border-radius: 9999px; padding: 0.25rem 0.625rem; font-size: 0.75rem; font-weight: 500; font-family: "JetBrains Mono", monospace; }
.blog-card-read { color: var(--md-primary); font-size: 0.875rem; font-weight: 600; display: flex; align-items: center; gap: 0.25rem; opacity: 0; transform: translateX(-4px); transition: opacity 200ms, transform 200ms; }
.blog-card:hover .blog-card-read { opacity: 1; transform: translateX(0); }

/* ---------- Blog Link Card ---------- */
.blog-link-card { display: block; background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 28px; padding: 2rem 2.25rem; transition: box-shadow 300ms, transform 300ms; text-decoration: none; }
.blog-link-card:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 2px 6px 2px rgba(0,0,0,0.15); transform: translateY(-4px); }
.blog-link-card .index { font-family: "JetBrains Mono", monospace; font-size: 0.875rem; color: var(--md-primary); font-weight: 500; }
.blog-link-card h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.025em; color: var(--md-on-surface); margin: 0.75rem 0 0.5rem; }
@media (min-width: 640px) { .blog-link-card h2 { font-size: 2rem; } }
.blog-link-card p { font-size: 1rem; color: var(--md-on-surface-variant); margin-bottom: 1.25rem; }
.blog-link-card .visit { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--md-primary); font-size: 0.875rem; font-weight: 600; }

/* ---------- About ---------- */
.about-text p { font-size: 1.125rem; line-height: 1.625; margin-bottom: 1.25rem; }
.about-text p:first-child { color: var(--md-on-surface); }
.about-text p:nth-child(n+2) { color: var(--md-on-surface-variant); }
.about-stack-label { font-family: "JetBrains Mono", monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--md-outline); margin-bottom: 1rem; margin-top: 1.5rem; }
.about-stack { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.about-stack span { background: var(--md-surface-container-high); color: var(--md-on-surface); border-radius: 0.5rem; padding: 0.5rem 0.875rem; font-size: 0.875rem; font-family: "JetBrains Mono", monospace; font-weight: 500; }

/* ---------- Contact ---------- */
.contact-card { background: var(--md-surface-container); border-radius: 36px; padding: 2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15); text-align: center; }
@media (min-width: 640px) { .contact-card { padding: 3.5rem; } }
.dark .contact-card { box-shadow: none; border: 1px solid var(--md-outline-variant); }
.contact-badge { display: inline-flex; align-items: center; gap: 0.5rem; background: var(--md-primary-container); color: var(--md-on-primary-container); border-radius: 9999px; padding: 0.375rem 0.875rem; font-size: 0.75rem; font-weight: 600; margin-bottom: 1.5rem; }
.contact-badge .dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: var(--md-on-primary-container); }
.contact-card h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.875rem; letter-spacing: -0.025em; color: var(--md-on-surface); margin-bottom: 1rem; }
@media (min-width: 640px) { .contact-card h2 { font-size: 3rem; } }
.contact-card .subtitle { max-width: 36rem; margin: 0 auto 2.5rem; font-size: 1rem; color: var(--md-on-surface-variant); }
@media (min-width: 640px) { .contact-card .subtitle { font-size: 1.125rem; } }
.contact-channels { display: grid; gap: 1rem; max-width: 42rem; margin: 0 auto; }
@media (min-width: 640px) { .contact-channels { grid-template-columns: repeat(3, 1fr); } }
.contact-channel { display: block; background: var(--md-surface-container-low); border: 1px solid var(--md-outline-variant); border-radius: 1.5rem; padding: 1.5rem; transition: box-shadow 200ms; text-align: center; }
.contact-channel:hover { box-shadow: 0 1px 2px rgba(0,0,0,0.30), 0 1px 3px 1px rgba(0,0,0,0.15); }
.contact-channel .icon { color: var(--md-primary); margin-bottom: 0.75rem; display: inline-flex; }
.contact-channel .label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--md-outline); margin-bottom: 0.25rem; }
.contact-channel .value { font-family: "JetBrains Mono", monospace; font-size: 0.875rem; font-weight: 500; color: var(--md-on-surface); }

/* ---------- Footer ---------- */
.footer { padding: 3rem 0; border-top: 1px solid var(--md-outline-variant); }
.footer-inner { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1rem; }

.footer-copy { font-size: 0.875rem; color: var(--md-on-surface-variant); }
.footer-built { font-size: 0.75rem; color: var(--md-outline); font-family: "JetBrains Mono", monospace; display: flex; align-items: center; gap: 0.375rem; }
.footer-built .dot { width: 0.375rem; height: 0.375rem; border-radius: 9999px; background: var(--md-primary); }

/* ---------- Misc ---------- */
::selection { background: var(--md-primary-container); color: var(--md-on-primary-container); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--md-surface-container-low); }
::-webkit-scrollbar-thumb { background: var(--md-outline-variant); border-radius: 9999px; border: 2px solid var(--md-surface-container-low); }
::-webkit-scrollbar-thumb:hover { background: var(--md-outline); }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar" id="navbar">
  <div class="navbar-inner">
    <a href="#top" class="navbar-logo"><span class="accent">{</span>ThinkReally114<span class="accent">}</span></a>

    <div class="navbar-actions">
      <button class="btn-icon" id="theme-btn" aria-label="toggle theme"></button>

function applyTheme() {
  document.documentElement.classList.toggle("dark", dark);

}

  lang = lang === "zh" ? "en" : "zh";
  _s.s("lang", lang);
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  render();
}

function toggleTheme() {
  dark = !dark;
  applyTheme();
}
