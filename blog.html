var WORKER_URL = "https://blog-counter.2507164880.workers.dev";
var VIEWS_CACHE = {};
var _viewsRetryTimer = null;

function incrementViews(key, callback) {
  if (typeof fetch === "undefined") { callback(null); return; }
  var localKey = "v_" + key;
  var localCount = 0;
  try { localCount = parseInt(localStorage.getItem(localKey) || '0', 10); } catch(e) {}
  localCount++;
  try { localStorage.setItem(localKey, localCount); } catch(e) {}
  VIEWS_CACHE[key] = localCount;
  callback(localCount);
  fetch(WORKER_URL + "?key=" + encodeURIComponent(key) + "&action=up")
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(d) {
      try { localStorage.setItem(localKey, d.count); } catch(e) {}
      VIEWS_CACHE[key] = d.count;
    })
    .catch(function() {
      if (_viewsRetryTimer) clearTimeout(_viewsRetryTimer);
      _viewsRetryTimer = setTimeout(function() {
        fetch(WORKER_URL + "?key=" + encodeURIComponent(key) + "&action=up")
          .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function(d) {
            try { localStorage.setItem(localKey, d.count); } catch(e) {}
            VIEWS_CACHE[key] = d.count;
          })
          .catch(function() {});
      }, 5000);
    });
}

function fetchViews(key, callback) {
  if (typeof fetch === "undefined") { callback(null); return; }
  var localKey = "v_" + key;
  try {
    var localCount = parseInt(localStorage.getItem(localKey) || '0', 10);
    if (localCount > 0) { callback(localCount); return; }
  } catch(e) {}
  fetch(WORKER_URL + "?key=" + encodeURIComponent(key) + "&action=get")
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(d) {
      try { localStorage.setItem(localKey, d.count); } catch(e) {}
      VIEWS_CACHE[key] = d.count;
      callback(d.count);
    })
    .catch(function() { callback(0); });
}

function getCachedViews(key) {
  if (VIEWS_CACHE[key] != null) return VIEWS_CACHE[key];
  try {
    var v = localStorage.getItem("v_" + key);
    if (v != null) { VIEWS_CACHE[key] = parseInt(v, 10); return VIEWS_CACHE[key]; }
  } catch(e) {}
  return null;
}

function fetchWithTimeout(url, timeout) {
  timeout = timeout || 10000;
  return new Promise(function(resolve, reject) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function() {
      if (controller) controller.abort();
      reject(new Error("timeout"));
    }, timeout);
    var opts = controller ? { signal: controller.signal } : {};
    fetch(url, opts).then(function(r) {
      clearTimeout(timer);
      resolve(r);
    }, function(e) {
      clearTimeout(timer);
      reject(e);
    });
  });
}

function parseGuiding(text) {
  var blocks = text.split(/\n\s*\n/);
  var posts = [];
  blocks.forEach(function(block) {
    var lines = block.trim().split("\n");
    var entry = {};
    lines.forEach(function(line) {
      line = line.trim();
      if (line.charAt(0) === "#" || line === "") return;
      var eqIdx = line.indexOf("=");
      if (eqIdx === -1) return;
      var key = line.substring(0, eqIdx).trim();
      var val = line.substring(eqIdx + 1).trim();
      entry[key] = val;
    });
    if (entry.Documenttitle && entry.URLtoGithub) {
      var rawDate = entry.Documentreleaseorupdatetime || "19700101";
      var dateStr = rawDate.substring(0, 4) + "-" + rawDate.substring(4, 6) + "-" + rawDate.substring(6, 8);
      posts.push({
        title: entry.Documenttitle,
        excerpt: entry.Briefintroductionofdocuments || "",
        date: dateStr,
        rawDate: rawDate,
        seq: parseInt(entry.Samedayupdatesequence || "0", 10),
        top: entry.Whethertosetthetop === "true",
        githubUrl: entry.URLtoGithub,
        giteeUrl: entry.IsthereaGiteeshunt === "true" ? entry.URLtoGitee : null
      });
    }
  });
  posts.sort(function(a, b) {
    if (a.top !== b.top) return b.top ? 1 : -1;
    if (a.rawDate !== b.rawDate) return b.rawDate.localeCompare(a.rawDate);
    return b.seq - a.seq;
  });
  return posts;
}

function githubBlobToRaw(url) {
  return url
    .replace("github.com", "raw.githubusercontent.com")
    .replace(/\/blob\/[a-f0-9]{7,40}\//, "/main/");
}

function renderMarkdown(md) {
  var html = md;
  html = html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  var codeBlocks = [];
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(m, lang, code) {
    var placeholder = "\x00CODEBLOCK" + codeBlocks.length + "\x00";
    codeBlocks.push('<pre><code>' + code + "</code></pre>");
    return placeholder;
  });
  var inlineCodes = [];
  html = html.replace(/`([^`]+)`/g, function(m, code) {
    var placeholder = "\x00INLINECODE" + inlineCodes.length + "\x00";
    inlineCodes.push("<code>" + code + "</code>");
    return placeholder;
  });
  html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
  html = html.replace(/^\> (.+)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/^---$/gm, "<hr>");
  var lines = html.split("\n");
  var result = [];
  var inList = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var ulMatch = line.match(/^[-*] (.+)$/);
    var olMatch = line.match(/^\d+\. (.+)$/);
    if (ulMatch) {
      if (inList !== "ul") { if (inList) result.push("</" + inList + ">"); result.push("<ul>"); inList = "ul"; }
      result.push("<li>" + ulMatch[1] + "</li>");
    } else if (olMatch) {
      if (inList !== "ol") { if (inList) result.push("</" + inList + ">"); result.push("<ol>"); inList = "ol"; }
      result.push("<li>" + olMatch[1] + "</li>");
    } else {
      if (inList) { result.push("</" + inList + ">"); inList = null; }
      if (line.trim() === "" || /^\x00/.test(line) || /^<(h[1-6]|blockquote|hr|pre|table)/.test(line.trim())) {
        result.push(line);
      } else {
        result.push("<p>" + line + "</p>");
      }
    }
  }
  if (inList) result.push("</" + inList + ">");
  html = result.join("\n");
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">');
  for (var i = 0; i < codeBlocks.length; i++) {
    html = html.replace("\x00CODEBLOCK" + i + "\x00", codeBlocks[i]);
  }
  for (var i = 0; i < inlineCodes.length; i++) {
    html = html.replace("\x00INLINECODE" + i + "\x00", inlineCodes[i]);
  }
  return html;
}

  document.getElementById("navbar-back").innerHTML = ICONS.arrow + " " + t.backToList;
  document.getElementById("article-body").innerHTML = '<div class="article-loading">' + t.loading + "</div>";
  document.getElementById("article-footer").innerHTML = "";

      viewsEl.innerHTML = ICONS.eye + " " + count.toLocaleString();
    }
  });

  var urlSuffix = buildPostUrlSuffix(post);
  if (typeof history !== "undefined" && history.pushState) {
    history.pushState({ article: idx }, "", "blog.html#" + CONFIG.hashPrefix + urlSuffix);
  }

  var sourceUrl = post.githubUrl || post.url;
  var rawUrl = sourceUrl ? githubBlobToRaw(sourceUrl) : null;

  if (!rawUrl || typeof fetch === "undefined") {
    showArticleContent('<p style="color:var(--md-on-surface-variant);text-align:center;padding:2rem">' + t.loadFailArticle + "</p>", post, t, sourceUrl, post.giteeUrl);
    return;
  }
  loadArticleContent(rawUrl, post, t, sourceUrl, 0);
}

function showArticleContent(html, post, t, sourceUrl, giteeUrl) {
  document.getElementById("article-body").innerHTML = html;
  var footerHtml = "";
  if (sourceUrl) {
    footerHtml += '<a href="' + sourceUrl + '" target="_blank" rel="noopener noreferrer" class="article-source-link">' + ICONS.githubSm + " GitHub</a>";
  }
  if (giteeUrl) {
    footerHtml += '<a href="' + giteeUrl + '" target="_blank" rel="noopener noreferrer" class="article-source-link">Gitee</a>';
  }
  document.getElementById("article-footer").innerHTML = footerHtml;
}

function loadArticleContent(url, post, t, sourceUrl, useMirror) {
  var fetchUrl = (useMirror && post.giteeUrl) ? post.giteeUrl : url;
  fetchWithTimeout(fetchUrl, 10000)
    .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function(text) {
      showArticleContent(renderMarkdown(text), post, t, sourceUrl, post.giteeUrl);
    })
    .catch(function(e) {
      if (e.message === "timeout" && !useMirror && post.giteeUrl) {
        if (confirm(t.mirrorPrompt)) {
          loadArticleContent(url, post, t, sourceUrl, 1);
          return;
        }
      }
      showArticleContent('<p style="color:var(--md-on-surface-variant);text-align:center;padding:2rem">' + t.loadFailArticle + "</p>", post, t, sourceUrl, post.giteeUrl);
    });
}

function closeArticle() {
  var artSection = document.getElementById("article-section");
  artSection.classList.remove("active");
  artSection.classList.add("closing");

  document.body.classList.remove("article-open");

  if (typeof history !== "undefined" && history.pushState) {
    history.pushState({}, "", "blog.html");

  setTimeout(function() {
    artSection.classList.remove("closing");
    document.getElementById("list-section").style.display = "";
    document.querySelector(".blog-hero").style.display = "";
    document.getElementById("list-section").classList.remove("fading");
    window.scrollTo(0, 0);
  }, 220);
}

function loadBlogList(t, tryAutoOpen, useMirror) {
  var url = useMirror ? BLOG_GUIDING_URL_GITEE : BLOG_GUIDING_URL;
  fetchWithTimeout(url, 10000)
    .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function(text) {
      var posts = parseGuiding(text);
      if (posts.length > 0) {
        computeUrlSeqs(posts);
        _cachedPosts = posts;
        renderPosts(posts, t);
        tryAutoOpen();
      } else {
        fallbackToLocal(t, tryAutoOpen);
      }
    })
    .catch(function(e) {
      if (e.message === "timeout" && !useMirror) {
        if (confirm(t.mirrorPrompt)) {
          loadBlogList(t, tryAutoOpen, 1);
          return;
        }
      }
      fallbackToLocal(t, tryAutoOpen);
    });
}

function fallbackToLocal(t, tryAutoOpen) {
  computeUrlSeqs(FALLBACK_POSTS);
  _cachedPosts = FALLBACK_POSTS;
  renderPosts(FALLBACK_POSTS, t);
  tryAutoOpen();
}

  document.getElementById("footer-copy").innerHTML = "© " + new Date().getFullYear() + " ThinkReally114. " + t.footer.rights + ".";
  document.getElementById("theme-btn").innerHTML = dark ? ICONS.sun : ICONS.moon;

  function tryAutoOpen() {
    if (!_cachedPosts) return;
    var suffix = getArticleSuffixFromUrl();
    if (!suffix) return;
    var idx = parseUrlSuffixToPost(suffix, _cachedPosts);
    if (idx >= 0) {
      setTimeout(function() { openArticle(_cachedPosts, idx, t, null); }, 100);
    }
  }

  if (typeof fetch === "undefined") {
    computeUrlSeqs(FALLBACK_POSTS);
    _cachedPosts = FALLBACK_POSTS;
    renderPosts(FALLBACK_POSTS, t);
    tryAutoOpen();
    return;
  }
  loadBlogList(t, tryAutoOpen, 0);
}

function applyTheme() {
  document.documentElement.classList.toggle("dark", dark);
  _s.s("theme", dark ? "dark" : "light");
  document.getElementById("theme-btn").innerHTML = dark ? ICONS.sun : ICONS.moon;
}

function toggleLang() {
  lang = lang === "zh" ? "en" : "zh";
  _s.s("lang", lang);
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  render();
}

function toggleTheme() {
  dark = !dark;
  applyTheme();
}

window.addEventListener("scroll", function() {
  document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 12);
}, { passive: true });

window.addEventListener("popstate", function(e) {
  if (document.body.classList.contains("article-open")) {
    closeArticle();
  }
});

try {
  document.documentElement.classList.toggle("dark", dark);
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.getElementById("lang-btn").addEventListener("click", toggleLang);
  document.getElementById("theme-btn").addEventListener("click", toggleTheme);
  document.getElementById("navbar-back").addEventListener("click", closeArticle);
  render();
} catch(e) {
  document.body.innerHTML = '<pre style="padding:2rem;color:#c00;font-family:monospace;white-space:pre-wrap">' + (e && e.stack ? e.stack : String(e)) + '</pre>';
}
</script>
</body>
</html>
